name: Website and help

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: drcom4scut
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: drcom4scut
          persist-credentials: false
      - name: Read the pinned desktop help revision
        id: sources
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          gui = json.loads(pathlib.Path('site/sources.json').read_text())['gui']
          if gui['repository'] != 'SeaLoong/drcom4scutGUI' or not re.fullmatch(r'[0-9a-f]{40}', gui['ref']):
              raise SystemExit('Website help must identify a complete upstream desktop commit')
          print('gui_ref=' + gui['ref'])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SeaLoong/drcom4scutGUI
          ref: ${{ steps.sources.outputs.gui_ref }}
          path: drcom4scutGUI
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: drcom4scut/site/package-lock.json
      - run: npm ci --prefix site
      - run: npm audit --prefix site --audit-level=moderate
      - run: npm run build --prefix site
      - name: Prepare reliable browser dependency downloads
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-drcom-ci-network > /dev/null
      - name: Install the browser used by the website checks
        timeout-minutes: 8
        working-directory: drcom4scut/site
        run: npx playwright install --with-deps chromium
      - name: Check search, navigation and mobile interactions
        working-directory: drcom4scut/site
        run: npm run test:browser
      - name: Keep browser failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-browser-failures
          path: drcom4scut/site/test-results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: drcom4scut/site/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'SeaLoong/drcom4scut'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

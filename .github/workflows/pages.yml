name: Website and help

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: drcom4scut
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: drcom4scut
          persist-credentials: false
      - name: Read the pinned desktop help revision
        id: sources
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          gui = json.loads(pathlib.Path('site/sources.json').read_text())['gui']
          if gui['repository'] != 'SeaLoong/drcom4scutGUI' or not re.fullmatch(r'[0-9a-f]{40}', gui['ref']):
              raise SystemExit('Website help must identify a complete upstream desktop commit')
          print('gui_ref=' + gui['ref'])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SeaLoong/drcom4scutGUI
          ref: ${{ steps.sources.outputs.gui_ref }}
          path: drcom4scutGUI
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: drcom4scut/site/package-lock.json
      - run: npm ci --prefix site
      - run: npm audit --prefix site --audit-level=moderate
      - run: npm run build --prefix site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: drcom4scut/site/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'SeaLoong/drcom4scut'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment

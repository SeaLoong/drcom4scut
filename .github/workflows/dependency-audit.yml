name: Dependency audit

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install verified official cargo-audit
        run: python3 .github/scripts/setup_cargo_audit.py --prefix "$RUNNER_TEMP/drcom-audit" --download-dir "$RUNNER_TEMP/drcom-audit-downloads" --github-path "$GITHUB_PATH"
      - run: cargo audit --deny warnings
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm audit --prefix site --audit-level=moderate

name: Validate and build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Audit locked Rust dependencies
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo audit --deny warnings
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +stable clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Check HTTP-only Portal feature combination
        run: |
          cargo +stable clippy --locked --all-targets --no-default-features --features portal -- -D warnings
          cargo +stable test --locked --no-default-features --features portal
      - name: Test package ABI validation and private OpenWrt service arguments
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Test LuCI ACL, safe RPC metadata and view fixtures
        run: python3 -m unittest discover -s packaging/openwrt/luci-app-drcom4scut/tests -v
      - name: Read the shared release platform manifest
        id: platforms
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          platforms = json.loads(pathlib.Path('.github/scripts/platforms.json').read_text())
          matrix = []
          for platform in platforms:
              target = platform['target']
              matrix.append({'os': platform['runner'], 'target': target, 'emulator': platform.get('emulator', ''), 'emulator_cpu': platform.get('emulator_cpu', ''), 'static': platform['openwrt'], 'profile': platform.get('profile', 'release'), 'toolchain': platform.get('toolchain', 'stable'), 'std_from_source': platform.get('std_from_source', False), 'cflags': platform.get('cflags', ''), 'features': ','.join(platform.get('features', [])), 'npcap_arch': platform.get('npcap_arch', '')})
          print('matrix=' + json.dumps({'include': matrix}))
          PY

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.quality.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ !matrix.std_from_source && matrix.target || '' }}
      - name: Install C tools for the statically linked TLS provider
        if: matrix.static
        timeout-minutes: 8
        shell: bash
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y clang llvm musl-tools
          # ring uses its freestanding C/assembly build on non-x86_64 musl.
          # Rust's self-contained linker still supplies the final static libc.
          if [[ '${{ matrix.target }}' == 'x86_64-unknown-linux-musl' ]]; then
            echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          else
            echo 'CC=clang' >> "$GITHUB_ENV"
          fi
          echo 'AR=llvm-ar' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"
      - name: Build the missing MIPS standard library with pinned stable Rust
        if: matrix.std_from_source
        timeout-minutes: 15
        env:
          TARGET: ${{ matrix.target }}
        run: python3 .github/scripts/setup_mips_toolchain.py --target "$TARGET" --work-dir "$RUNNER_TEMP/mips-work" --prefix "$RUNNER_TEMP/mips-tools" --github-env "$GITHUB_ENV" --jobs 2
      - name: Configure static linking and platform C ABI
        if: matrix.static
        env:
          PLATFORM_CFLAGS: ${{ matrix.cflags }}
        run: |
          echo 'RUSTFLAGS=-C linker=rust-lld -C target-feature=+crt-static' >> "$GITHUB_ENV"
          printf 'CFLAGS=%s\n' "$PLATFORM_CFLAGS" >> "$GITHUB_ENV"
      - name: Install user-mode emulator for cross-target tests
        if: matrix.emulator != ''
        timeout-minutes: 8
        env:
          EMULATOR: ${{ matrix.emulator }}
          EMULATOR_CPU: ${{ matrix.emulator_cpu }}
          TARGET: ${{ matrix.target }}
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y qemu-user
          # Foreign-CPU suites run serially; each protocol test still drives concurrent async tasks.
          echo 'RUST_TEST_THREADS=1' >> "$GITHUB_ENV"
          runner="$RUNNER_TEMP/drcom-target-runner"
          cat > "$runner" <<'SH'
          #!/bin/sh
          if [ -n "$DRCOM_QEMU_CPU" ]; then
            exec "$DRCOM_QEMU_EXECUTABLE" -cpu "$DRCOM_QEMU_CPU" "$@"
          fi
          exec "$DRCOM_QEMU_EXECUTABLE" "$@"
          SH
          chmod +x "$runner"
          printf 'DRCOM_QEMU_EXECUTABLE=%s\nDRCOM_QEMU_CPU=%s\nDRCOM_TEST_RUNNER=%s\n' "$EMULATOR" "$EMULATOR_CPU" "$runner" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')_RUNNER=$runner" >> "$GITHUB_ENV"
      - name: Use verified static QEMU for big-endian netlink enumeration
        if: matrix.emulator == 'qemu-mips' || matrix.emulator == 'qemu-ppc64'
        timeout-minutes: 8
        env:
          EMULATOR: ${{ matrix.emulator }}
        run: python3 .github/scripts/setup_qemu.py --emulator "$EMULATOR" --prefix "$RUNNER_TEMP/drcom-qemu" --download-dir "$RUNNER_TEMP/drcom-qemu-downloads" --github-env "$GITHUB_ENV"
      - name: Install Windows packet capture SDK
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-npcap
        with:
          architecture: ${{ matrix.npcap_arch }}
      - name: Test Windows service ACL policy without administrator rights
        if: runner.os == 'Windows'
        run: powershell -NoProfile -NonInteractive -File scripts/test-service-acl.ps1
      - name: Test default features, including mock EAP/UDP and CLI integration
        if: matrix.features == ''
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Test static router feature set
        if: matrix.features != ''
        run: cargo test --locked --target ${{ matrix.target }} --no-default-features --features '${{ matrix.features }}'
      - name: Test minimal features
        run: cargo test --locked --target ${{ matrix.target }} --no-default-features
      - name: Build release
        if: matrix.features == ''
        run: cargo build --locked --profile '${{ matrix.profile }}' --target ${{ matrix.target }}
      - name: Build static router release
        if: matrix.features != ''
        run: cargo build --locked --profile '${{ matrix.profile }}' --target ${{ matrix.target }} --no-default-features --features '${{ matrix.features }}'
      - name: Build minimal feature executable
        run: cargo build --locked --target ${{ matrix.target }} --no-default-features
      - name: Validate target ABI and package tested executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EMULATOR: ${{ matrix.emulator }}
        run: python .github/scripts/package_release.py "$TARGET" --runner "${DRCOM_TEST_RUNNER:-$EMULATOR}"
      - name: Install the exact release archive through the real updater
        shell: bash
        run: python .github/scripts/test_update_package.py --target '${{ matrix.target }}' --features '${{ matrix.features }}'
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

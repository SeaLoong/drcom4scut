name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let a master build finish publishing; newer PR revisions can replace old ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/validate-build.yml

  preview:
    name: Publish preview
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'SeaLoong/drcom4scut'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: core-preview-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify the complete shared platform matrix and checksums
        run: python3 .github/scripts/verify_release.py
      - name: Publish verified development preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_preview.py

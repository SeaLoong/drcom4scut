name: Install Npcap SDK
description: Download the version-pinned official SDK using normal TLS verification.
inputs:
  architecture:
    description: Native SDK library architecture (x64 or ARM64).
    required: false
    default: x64
runs:
  using: composite
  steps:
    - name: Download and select native import libraries
      shell: pwsh
      env:
        NPCAP_ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        $ErrorActionPreference = 'Stop'
        $sdkArch = $env:NPCAP_ARCHITECTURE
        if ($sdkArch -notin @('x64', 'ARM64')) {
          throw 'Npcap SDK architecture must be x64 or ARM64'
        }
        $sdkRoot = Join-Path $env:RUNNER_TEMP 'npcap-sdk-1.15'
        $archive = Join-Path $env:RUNNER_TEMP 'npcap-sdk-1.15.zip'
        Invoke-WebRequest -Uri 'https://npcap.com/dist/npcap-sdk-1.15.zip' -OutFile $archive
        Expand-Archive -LiteralPath $archive -DestinationPath $sdkRoot -Force
        foreach ($name in @('Packet.lib', 'wpcap.lib')) {
          $library = Join-Path $sdkRoot "Lib/$sdkArch/$name"
          if (!(Test-Path -LiteralPath $library -PathType Leaf)) {
            throw "Official Npcap SDK is missing Lib/$sdkArch/$name"
          }
          Copy-Item -LiteralPath $library -Destination (Join-Path $env:GITHUB_WORKSPACE $name)
        }
        "LIB=$sdkRoot/Lib/$sdkArch;$env:LIB" >> $env:GITHUB_ENV
        "LIBPCAP_LIBDIR=$sdkRoot/Lib/$sdkArch" >> $env:GITHUB_ENV
        # Mock/CLI tests do not capture packets. Delay loading lets them run without
        # installing a capture driver on the runner; real capture still needs Npcap.
        'RUSTFLAGS=-C link-arg=/DELAYLOAD:Packet.dll -C link-arg=/DELAYLOAD:wpcap.dll -C link-arg=delayimp.lib' >> $env:GITHUB_ENV

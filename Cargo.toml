[package]
name = "drcom4scut"
version = "0.6.1"
rust-version = "1.99"
authors = ["SeaLoong <sealoongw@foxmail.com>"]
edition = "2024"
description = "A 3rd-party Drcom client for SCUT."
license = "LGPL-3.0-or-later"
readme = "README.md"

[dependencies]
socket2 = { version = "0.6.5", features = ["all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["cargo"] }
encoding_rs = "0.8.42"
hex = "0.4.3"
hostname = "0.4.2"
log = "0.4.34"
md-5 = "0.11.0"
pnet = "0.35.0"
rand = "0.10.3"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "process", "io-util"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.11.1"
semver = "1.0.28"
tempfile = "3.27.0"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1.0.11"
rustls-native-certs = "0.8.5"

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["query", "json", "form", "rustls-no-provider"]

[dependencies.config]
version = "0.15.27"
default-features = false
features = ["yaml"]

[dependencies.log4rs]
version = "1.4.0"
default-features = false
features = ["console_appender", "rolling_file_appender", "compound_policy", "fixed_window_roller", "size_trigger", "gzip"]
optional = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
panic = 'abort'
strip = true

# Router releases retain the same features but optimize for flash footprint.
[profile.router]
inherits = "release"
opt-level = "z"
codegen-units = 1

[features]
default = ["log4rs", "portal-tls"]
portal = []
portal-tls = ["portal"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
pcap = "2.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_LibraryLoader", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

windows-service = "0.8.1"

# drcom4scut configuration. Leave optional fields empty to use their defaults.
mode: eap
interface:
profile: legacy
# Keep the password out of this file when possible. Relative paths use this directory.
password_file:
no_udp: false
no_log: false
once: false
local_port: 36144
server_port: 61440
eap_ip:
udp_ip:
gateway:
dns2:
status_file:
reconnect_max: 300
# Automatic checks notify only; install explicitly with drcom4scut --update.
# The first check runs 60 seconds after the first complete online connection.
update:
  enabled: true
  proxy: https://gh-proxy.com/
  interval_hours: 24
hooks:
  online: []
  offline: []
  timeout: 10
portal:
  base_url: https://s.scut.edu.cn
  api_url:
  ac_ip:
  client_ip:
  # Only enable deliberately when your campus portal requires cleartext HTTP.
  allow_http: false
mac:
ip:
username:
password:
dns:
  - 202.38.193.33
  - 222.201.130.30
  - 202.112.17.33
  - 222.201.130.33
host: s.scut.edu.cn
hostname:
time: 7:00
reconnect: 15
heartbeat:
  eap_timeout: 60
  udp_timeout: 12
retry:
  count: 2
  interval: 5000
log:
  enable_console: true
  enable_file: true
  file_directory: ./logs
  level: INFO
data:
  response_identity:
    unknown:
  response_md5_challenge:
    unknown:
  misc_info:
    unknown1:
    cks32_param:
    unknown2:
    os_major:
    os_minor:
    os_build:
    os_unknown:
    version:
    hash:
